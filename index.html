<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Entreno Minimal" />
  <title>Entreno Minimal v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #121216;
      --surface-2: #18181d;
      --surface-3: #222229;
      --border: #27272e;
      --text: #f4f4f6;
      --muted: #9a9aa6;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --accent-inv: #052e16;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 9px;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .app {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px 96px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .sub {
      margin: 3px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 520px) {
      .grid-2 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="date"],
    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 44px;
      padding: 0 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      border-radius: var(--radius-md) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 42px;
    }

    input[type="date"]::-webkit-datetime-edit {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 0;
    }

    input[type="date"]::-webkit-datetime-edit-fields-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }

    input[type="date"]::-webkit-date-and-time-value {
      text-align: center;
      margin: 0 auto;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 4px;
    }

    .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .seg button.active {
      background: var(--accent);
      color: var(--accent-inv);
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: var(--radius-md);
      padding: 9px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
    }

    .btn:hover {
      background: var(--surface-3);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-inv);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger-bg);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .btn-sm {
      padding: 6px 10px;
      min-height: 32px;
      font-size: 0.78rem;
      border-radius: var(--radius-sm);
    }

    .routine-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .routine-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .routine-item.selected {
      border-color: var(--accent);
    }

    .routine-name {
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      flex: 1;
      min-width: 140px;
    }

    .routine-meta {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .ex-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .set-line {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1fr) minmax(106px, 1.2fr);
      gap: 6px;
      align-items: center;
    }

    .set-num {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      font-weight: 600;
    }

    .set-line input,
    .set-line select {
      height: 38px;
      font-size: 0.84rem;
      padding: 0 7px;
    }

    @media (max-width: 420px) {
      .set-line {
        grid-template-columns: 28px minmax(0, 0.9fr) minmax(0, 0.9fr) minmax(98px, 1.15fr);
        gap: 5px;
      }

      .set-line input,
      .set-line select {
        font-size: 0.8rem;
        padding: 0 6px;
      }
    }

    .empty {
      text-align: center;
      padding: 18px 12px;
      color: var(--muted);
      font-size: 0.88rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(18, 18, 22, 0.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 20;
    }

    .nav button {
      flex: 1;
      max-width: 220px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .nav button.active {
      background: var(--surface-3);
      color: var(--text);
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      transition: transform 0.2s ease;
      z-index: 50;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .log-item {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .log-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="app">
    <header class="header">
      <div class="title-wrap">
        <h1>Entreno Minimal <span class="badge">v2 · Local</span></h1>
        <p id="statusText" class="sub">Listo para entrenar</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-sm" onclick="exportData()">Exportar</button>
        <button class="btn btn-sm" onclick="document.getElementById('importFile').click()">Importar</button>
        <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)" />
      </div>
    </header>

    <!-- VISTA ENTRENAR -->
    <section id="view-train" style="display:flex;flex-direction:column;gap:14px;">
      <div class="card">
        <p class="card-title">Registro diario</p>
        <div class="grid-2">
          <div class="field">
            <label for="dateInput">Fecha</label>
            <input id="dateInput" type="date" onchange="saveDraft()" />
          </div>
          <div class="field">
            <label for="weightInput">Peso en ayunas (kg)</label>
            <input id="weightInput" type="number" step="0.1" inputmode="decimal" placeholder="Ej. 76.4" oninput="saveDraft()" />
          </div>
        </div>
        <div class="field">
          <label>Estado nutricional</label>
          <div class="seg">
            <button id="state-fasted" type="button" class="active" onclick="setNutriState('En ayunas')">En ayunas</button>
            <button id="state-fed" type="button" onclick="setNutriState('Después de comer')">Después de comer</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="row-between">
          <p class="card-title">Mis rutinas</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="addStarterRoutines()">+ Plantilla base</button>
            <button class="btn btn-sm btn-primary" onclick="createRoutinePrompt()">+ Nueva rutina</button>
          </div>
        </div>
        <div id="routinesContainer" class="routine-list"></div>
      </div>

      <div id="activeRoutineCard" class="card hidden">
        <div class="row-between">
          <div>
            <p class="card-title">Rutina activa</p>
            <h2 id="activeRoutineTitle" style="margin:2px 0 0;font-size:1.05rem;"></h2>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="renameActiveRoutinePrompt()">Renombrar rutina</button>
            <button class="btn btn-sm" onclick="addExercisePrompt()">+ Ejercicio</button>
          </div>
        </div>
        <div id="exercisesContainer" style="display:flex;flex-direction:column;gap:10px;"></div>
        <button class="btn btn-primary" onclick="saveWorkoutSession()">Guardar sesión de hoy</button>
      </div>
    </section>

    <!-- VISTA HISTORIAL -->
    <section id="view-history" class="hidden" style="display:flex;flex-direction:column;gap:14px;">
      <div class="card">
        <div class="row-between">
          <p class="card-title">Historial guardado</p>
          <button class="btn btn-sm btn-danger" onclick="clearHistory()">Borrar historial</button>
        </div>
        <div id="historyContainer" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </section>
  </div>

  <nav class="nav">
    <button id="nav-train" class="active" onclick="switchTab('train')">Entrenar</button>
    <button id="nav-history" onclick="switchTab('history')">Historial</button>
  </nav>

  <script>
    const STORAGE_KEY = 'entreno_minimal_v2';

    const GEAR_LABELS = {
      none: 'Sin extra',
      wrist: 'Muñequeras',
      straps: 'Straps'
    };

    const defaultState = {
      date: new Date().toISOString().slice(0, 10),
      weight: '',
      nutriState: 'En ayunas',
      routines: [],
      selectedRoutineId: null,
      history: []
    };

    function normalizeState(rawState) {
      const merged = { ...structuredClone(defaultState), ...(rawState || {}) };
      merged.routines = Array.isArray(merged.routines)
        ? merged.routines.map(r => ({
            ...r,
            exercises: Array.isArray(r.exercises)
              ? r.exercises.map(ex => ({
                  ...ex,
                  sets: Array.isArray(ex.sets)
                    ? ex.sets.map(s => ({
                        kg: s?.kg ?? '',
                        reps: s?.reps ?? '',
                        gear: s?.gear && GEAR_LABELS[s.gear] ? s.gear : 'none'
                      }))
                    : []
                }))
              : []
          }))
        : [];
      merged.history = Array.isArray(merged.history) ? merged.history : [];
      return merged;
    }

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        return normalizeState(JSON.parse(raw));
      } catch {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function saveDraft() {
      state.date = document.getElementById('dateInput').value || state.date;
      state.weight = document.getElementById('weightInput').value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateStatus();
    }

    function setNutriState(val) {
      state.nutriState = val;
      saveState();
    }

    function createRoutinePrompt() {
      const name = prompt('Nombre de la nueva rutina (ej. Torso A, Pierna, Empuje):');
      if (!name || !name.trim()) return;
      const id = 'r_' + Date.now();
      state.routines.push({ id, name: name.trim(), exercises: [] });
      state.selectedRoutineId = id;
      saveState();
      showToast('Rutina creada');
    }

    function renameRoutine(id) {
      const routine = state.routines.find(r => r.id === id);
      if (!routine) return;
      const nextName = prompt('Nuevo nombre para la rutina:', routine.name);
      if (!nextName || !nextName.trim()) return;
      routine.name = nextName.trim();
      saveState();
      showToast('Nombre de rutina actualizado');
    }

    function renameActiveRoutinePrompt() {
      if (!state.selectedRoutineId) return;
      renameRoutine(state.selectedRoutineId);
    }

    function addStarterRoutines() {
      const templates = [
        {
          id: 'r_torso_' + Date.now(),
          name: 'Torso',
          exercises: [
            {
              id: 'e1',
              name: 'Press banca',
              sets: [
                { kg: '', reps: '', gear: 'none' },
                { kg: '', reps: '', gear: 'none' },
                { kg: '', reps: '', gear: 'none' }
              ]
            },
            {
              id: 'e2',
              name: 'Remo con barra',
              sets: [
                { kg: '', reps: '', gear: 'none' },
                { kg: '', reps: '', gear: 'none' },
                { kg: '', reps: '', gear: 'none' }
              ]
            }
          ]
        },
        {
          id: 'r_pierna_' + (Date.now() + 1),
          name: 'Pierna',
          exercises: [
            {
              id: 'e3',
              name: 'Sentadilla',
              sets: [
                { kg: '', reps: '', gear: 'none' },
                { kg: '', reps: '', gear: 'none' },
                { kg: '', reps: '', gear: 'none' }
              ]
            },
            {
              id: 'e4',
              name: 'Peso muerto rumano',
              sets: [
                { kg: '', reps: '', gear: 'none' },
                { kg: '', reps: '', gear: 'none' },
                { kg: '', reps: '', gear: 'none' }
              ]
            }
          ]
        }
      ];
      state.routines.push(...templates);
      if (!state.selectedRoutineId) state.selectedRoutineId = templates[0].id;
      saveState();
      showToast('Plantillas añadidas');
    }

    function selectRoutine(id) {
      state.selectedRoutineId = id;
      saveState();
    }

    function deleteRoutine(id) {
      const target = state.routines.find(r => r.id === id);
      if (!target) return;
      if (!confirm(`¿Borrar la rutina "${target.name}"?`)) return;
      state.routines = state.routines.filter(r => r.id !== id);
      if (state.selectedRoutineId === id) {
        state.selectedRoutineId = state.routines[0]?.id || null;
      }
      saveState();
      showToast('Rutina borrada');
    }

    function addExercisePrompt() {
      const routine = state.routines.find(r => r.id === state.selectedRoutineId);
      if (!routine) return;
      const name = prompt('Nombre del ejercicio:');
      if (!name || !name.trim()) return;
      routine.exercises.push({
        id: 'ex_' + Date.now(),
        name: name.trim(),
        sets: [
          { kg: '', reps: '', gear: 'none' },
          { kg: '', reps: '', gear: 'none' }
        ]
      });
      saveState();
      showToast('Ejercicio añadido');
    }

    function renameExercise(exId) {
      const routine = state.routines.find(r => r.id === state.selectedRoutineId);
      const ex = routine?.exercises.find(e => e.id === exId);
      if (!ex) return;
      const nextName = prompt('Nuevo nombre para el ejercicio:', ex.name);
      if (!nextName || !nextName.trim()) return;
      ex.name = nextName.trim();
      saveState();
      showToast('Ejercicio renombrado');
    }

    function deleteExercise(exId) {
      const routine = state.routines.find(r => r.id === state.selectedRoutineId);
      if (!routine) return;
      routine.exercises = routine.exercises.filter(e => e.id !== exId);
      saveState();
    }

    function addSet(exId) {
      const routine = state.routines.find(r => r.id === state.selectedRoutineId);
      const ex = routine?.exercises.find(e => e.id === exId);
      if (!ex) return;
      const prevGear = ex.sets[ex.sets.length - 1]?.gear || 'none';
      ex.sets.push({ kg: '', reps: '', gear: prevGear });
      saveState();
    }

    function updateSet(exId, idx, field, val) {
      const routine = state.routines.find(r => r.id === state.selectedRoutineId);
      const ex = routine?.exercises.find(e => e.id === exId);
      if (!ex || !ex.sets[idx]) return;
      ex.sets[idx][field] = val;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function updateSetGear(exId, idx, val) {
      const routine = state.routines.find(r => r.id === state.selectedRoutineId);
      const ex = routine?.exercises.find(e => e.id === exId);
      if (!ex || !ex.sets[idx]) return;
      ex.sets[idx].gear = GEAR_LABELS[val] ? val : 'none';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function saveWorkoutSession() {
      const routine = state.routines.find(r => r.id === state.selectedRoutineId);
      const exercisesSnapshot = routine
        ? routine.exercises.map(ex => ({
            name: ex.name,
            sets: ex.sets.map(s => ({
              kg: s.kg,
              reps: s.reps,
              gear: s.gear || 'none'
            }))
          }))
        : [];

      state.history.unshift({
        id: 'h_' + Date.now(),
        date: state.date,
        weight: state.weight || null,
        nutriState: state.nutriState,
        routineName: routine ? routine.name : 'Sin rutina',
        exercises: exercisesSnapshot
      });
      saveState();
      showToast('Sesión guardada en historial');
    }

    function clearHistory() {
      if (!confirm('¿Borrar todo el historial de sesiones?')) return;
      state.history = [];
      saveState();
      showToast('Historial borrado');
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `entreno-minimal-v2-${state.date}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Copia exportada');
    }

    function importData(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          state = normalizeState(parsed);
          saveState();
          showToast('Datos importados');
        } catch {
          showToast('Archivo no válido');
        }
      };
      reader.readAsText(file);
    }

    function switchTab(tab) {
      ['train', 'history'].forEach(t => {
        document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('nav-' + t).classList.toggle('active', t === tab);
      });
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    function updateStatus() {
      const p = state.weight ? `${state.weight} kg · ${state.nutriState}` : state.nutriState;
      document.getElementById('statusText').textContent = `${state.date} · ${p}`;
    }

    function formatSetSummary(s, index) {
      const kgText = s.kg !== '' && s.kg != null ? `${escapeHtml(s.kg)} kg` : '— kg';
      const repsText = s.reps !== '' && s.reps != null ? `${escapeHtml(s.reps)} reps` : '— reps';
      const gearText = s.gear && s.gear !== 'none' ? ` · ${escapeHtml(GEAR_LABELS[s.gear])}` : '';
      return `#${index + 1} (${kgText} × ${repsText}${gearText})`;
    }

    function render() {
      document.getElementById('dateInput').value = state.date;
      document.getElementById('weightInput').value = state.weight;
      document.getElementById('state-fasted').classList.toggle('active', state.nutriState === 'En ayunas');
      document.getElementById('state-fed').classList.toggle('active', state.nutriState === 'Después de comer');
      updateStatus();

      const rContainer = document.getElementById('routinesContainer');
      if (!state.routines.length) {
        rContainer.innerHTML = `<div class="empty"><span>Aún no tienes rutinas creadas.</span></div>`;
      } else {
        rContainer.innerHTML = state.routines.map(r => `
          <div class="routine-item ${r.id === state.selectedRoutineId ? 'selected' : ''}">
            <div class="routine-name" onclick="selectRoutine('${r.id}')">
              <div>${escapeHtml(r.name)}</div>
              <div class="routine-meta">${r.exercises.length} ejercicio(s)</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn btn-sm" onclick="selectRoutine('${r.id}')">Abrir</button>
              <button class="btn btn-sm" onclick="renameRoutine('${r.id}')">Renombrar</button>
              <button class="btn btn-sm btn-danger" onclick="deleteRoutine('${r.id}')">Borrar</button>
            </div>
          </div>
        `).join('');
      }

      const activeCard = document.getElementById('activeRoutineCard');
      const activeRoutine = state.routines.find(r => r.id === state.selectedRoutineId);
      if (!activeRoutine) {
        activeCard.classList.add('hidden');
      } else {
        activeCard.classList.remove('hidden');
        document.getElementById('activeRoutineTitle').textContent = activeRoutine.name;
        const exContainer = document.getElementById('exercisesContainer');
        if (!activeRoutine.exercises.length) {
          exContainer.innerHTML = `<div class="empty"><span>Añade tu primer ejercicio a esta rutina.</span></div>`;
        } else {
          exContainer.innerHTML = activeRoutine.exercises.map(ex => `
            <div class="ex-card">
              <div class="row-between">
                <strong>${escapeHtml(ex.name)}</strong>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  <button class="btn btn-sm" onclick="renameExercise('${ex.id}')">Renombrar</button>
                  <button class="btn btn-sm" onclick="addSet('${ex.id}')">+ Serie</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteExercise('${ex.id}')">Quitar</button>
                </div>
              </div>
              ${ex.sets.map((s, idx) => `
                <div class="set-line">
                  <span class="set-num">#${idx + 1}</span>
                  <input type="number" step="0.5" inputmode="decimal" placeholder="kg" value="${escapeHtml(s.kg)}" oninput="updateSet('${ex.id}', ${idx}, 'kg', this.value)" />
                  <input type="number" inputmode="numeric" placeholder="reps" value="${escapeHtml(s.reps)}" oninput="updateSet('${ex.id}', ${idx}, 'reps', this.value)" />
                  <select aria-label="Muñequeras o straps serie ${idx + 1}" onchange="updateSetGear('${ex.id}', ${idx}, this.value)">
                    <option value="none" ${(s.gear || 'none') === 'none' ? 'selected' : ''}>Sin extra</option>
                    <option value="wrist" ${s.gear === 'wrist' ? 'selected' : ''}>Muñequeras</option>
                    <option value="straps" ${s.gear === 'straps' ? 'selected' : ''}>Straps</option>
                  </select>
                </div>
              `).join('')}
            </div>
          `).join('');
        }
      }

      const hContainer = document.getElementById('historyContainer');
      if (!state.history.length) {
        hContainer.innerHTML = `<div class="empty"><span>No hay sesiones registradas todavía.</span></div>`;
      } else {
        hContainer.innerHTML = state.history.map(item => {
          const detailsHtml = Array.isArray(item.exercises) && item.exercises.length
            ? `<div class="log-details">${item.exercises.map(ex => `
                <div>
                  <strong style="color:var(--text);font-weight:600;">${escapeHtml(ex.name)}:</strong>
                  ${(ex.sets || []).map((s, i) => formatSetSummary(s, i)).join(' · ')}
                </div>
              `).join('')}</div>`
            : '';

          return `
            <div class="log-item">
              <div class="log-header">
                <div>
                  <strong>${escapeHtml(item.routineName)}</strong>
                  <div class="routine-meta">${escapeHtml(item.date)} · ${escapeHtml(item.nutriState)}</div>
                </div>
                <div class="badge">${item.weight ? escapeHtml(item.weight) + ' kg' : 'Sin peso'}</div>
              </div>
              ${detailsHtml}
            </div>
          `;
        }).join('');
      }
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    render();
  </script>
</body>
</html>
